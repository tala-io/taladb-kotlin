name: Docs

# Publishes the Dokka API reference to GitHub Pages. Enable Pages for this
# repository with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The default package list includes the legacy `tools` package, which
      # the SDK repository no longer serves, so the step failed before Dokka
      # ran. The runner image already has the SDK; only platform-tools is
      # asked for.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # Dokka reads sources only, so the native engine is not needed — but the
      # build's preBuild check is, and an empty header satisfies it.
      - name: Generate API docs
        run: |
          mkdir -p engine/include && touch engine/include/taladb.h
          ./gradlew :taladb:dokkaGeneratePublicationHtml --console=plain

      - uses: actions/upload-pages-artifact@v3
        with:
          path: taladb/build/dokka/html

      - id: deploy
        uses: actions/deploy-pages@v4
